name: Build AVESON CONTROL HUB APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Build AVESON CONTROL HUB
        run: gradle assembleDebug

      - name: Upload AVESON APK
        uses: actions/upload-artifact@v4
        with:
          name: AVESON-CONTROL-HUB-debug
          path: app/build/outputs/apk/debug/app-debug.apk
