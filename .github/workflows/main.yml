package com.aveson.central;

import android.app.Activity;
import android.os.Bundle;
import android.graphics.Color;
import android.graphics.Typeface;
import android.graphics.drawable.GradientDrawable;
import android.view.Gravity;
import android.widget.LinearLayout;
import android.widget.TextView;
import android.widget.Toast;

public class MainActivity extends Activity {

    private LinearLayout root;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        showCentral();
    }

    // =========================================================
    // AVESON CENTRAL
    // =========================================================

    private void showCentral() {

        root = new LinearLayout(this);
        root.setOrientation(LinearLayout.VERTICAL);
        root.setPadding(24, 24, 24, 24);
        root.setBackgroundColor(Color.rgb(7, 7, 18));

        // TOP BAR
        LinearLayout top = new LinearLayout(this);
        top.setGravity(Gravity.CENTER_VERTICAL);

        TextView menu = new TextView(this);
        menu.setText("☰");
        menu.setTextColor(Color.WHITE);
        menu.setTextSize(28);
        menu.setGravity(Gravity.CENTER);
        menu.setPadding(12, 8, 20, 8);

        menu.setOnClickListener(v -> showMenu());

        top.addView(menu);

        TextView title = new TextView(this);
        title.setText("AVESON CENTRAL");
        title.setTextColor(Color.WHITE);
        title.setTextSize(23);
        title.setTypeface(Typeface.DEFAULT, Typeface.BOLD);

        top.addView(title);

        root.addView(top);

        // SUBTITLE
        TextView subtitle = new TextView(this);
        subtitle.setText("Global Management System");
        subtitle.setTextColor(Color.rgb(165, 155, 205));
        subtitle.setTextSize(14);
        subtitle.setPadding(8, 8, 8, 18);

        root.addView(subtitle);

        // =====================================================
        // ARTIST CONTROL
        // =====================================================

        addRoom(
                "🎤",
                "AVESON ARTIST CONTROL",
                "Artistlar va release'larni boshqarish.",
                "ARTIST"
        );

        // =====================================================
        // MUSIC CONTROL
        // =====================================================

        addRoom(
                "🎵",
                "AVESON MUSIC CONTROL",
                "Music katalog va music tizimini boshqarish.",
                "MUSIC"
        );

        // =====================================================
        // DISTRIBUTION CONTROL
        // =====================================================

        addRoom(
                "🌐",
                "AVESON DISTRIBUTION CONTROL",
                "Release'larni global platformalarga tarqatish.",
                "DISTRIBUTION"
        );

        setContentView(root);
    }

    // =========================================================
    // CENTRAL ROOM CARD
    // =========================================================

    private void addRoom(
            String icon,
            String title,
            String description,
            String type
    ) {

        LinearLayout card = new LinearLayout(this);
        card.setOrientation(LinearLayout.VERTICAL);
        card.setPadding(24, 20, 24, 20);

        GradientDrawable background = new GradientDrawable();
        background.setColor(Color.rgb(20, 17, 38));
        background.setCornerRadius(28);
        background.setStroke(
                2,
                Color.rgb(70, 55, 120)
        );

        card.setBackground(background);

        // ICON
        TextView iconView = new TextView(this);
        iconView.setText(icon);
        iconView.setTextSize(27);

        card.addView(iconView);

        // TITLE
        TextView name = new TextView(this);
        name.setText(title);
        name.setTextColor(Color.WHITE);
        name.setTextSize(18);
        name.setTypeface(
                Typeface.DEFAULT,
                Typeface.BOLD
        );
        name.setPadding(0, 8, 0, 4);

        card.addView(name);

        // DESCRIPTION
        TextView desc = new TextView(this);
        desc.setText(description);
        desc.setTextColor(
                Color.rgb(175, 170, 200)
        );
        desc.setTextSize(13);

        card.addView(desc);

        // CLICK
        card.setOnClickListener(v -> {

            if (type.equals("ARTIST")) {
                showMessage(
                        "AVESON ARTIST CONTROL"
                );
            }

            if (type.equals("MUSIC")) {
                showMusicControl();
            }

            if (type.equals("DISTRIBUTION")) {
                showMessage(
                        "AVESON DISTRIBUTION CONTROL"
                );
            }
        });

        LinearLayout.LayoutParams params =
                new LinearLayout.LayoutParams(
                        LinearLayout.LayoutParams.MATCH_PARENT,
                        LinearLayout.LayoutParams.WRAP_CONTENT
                );

        params.setMargins(
                0,
                8,
                0,
                12
        );

        root.addView(card, params);
    }

    // =========================================================
    // AVESON MUSIC CONTROL
    // =========================================================

    private void showMusicControl() {

        root = new LinearLayout(this);
        root.setOrientation(
                LinearLayout.VERTICAL
        );

        root.setPadding(
                24,
                24,
                24,
                24
        );

        root.setBackgroundColor(
                Color.rgb(7, 7, 18)
        );

        // BACK
        TextView back = new TextView(this);

        back.setText(
                "← BACK TO AVESON CENTRAL"
        );

        back.setTextColor(
                Color.rgb(120, 190, 255)
        );

        back.setTextSize(16);

        back.setPadding(
                8,
                8,
                8,
                18
        );

        back.setOnClickListener(
                v -> showCentral()
        );

        root.addView(back);

        // TITLE
        TextView title = new TextView(this);

        title.setText(
                "AVESON MUSIC CONTROL"
        );

        title.setTextColor(
                Color.WHITE
        );

        title.setTextSize(27);

        title.setTypeface(
                Typeface.DEFAULT,
                Typeface.BOLD
        );

        title.setPadding(
                8,
                8,
                8,
                4
        );

        root.addView(title);

        // SUBTITLE
        TextView subtitle = new TextView(this);

        subtitle.setText(
                "Music catalog • Playlists • Content management"
        );

        subtitle.setTextColor(
                Color.rgb(165, 155, 205)
        );

        subtitle.setTextSize(14);

        subtitle.setPadding(
                8,
                4,
                8,
                24
        );

        root.addView(subtitle);

        // =====================================================
        // MUSIC SECTIONS
        // =====================================================

        addMusicControlButton(
                "🎵  MUSIC CATALOG",
                "Tracks • Albums • Releases"
        );

        addMusicControlButton(
                "📀  ALBUMS & RELEASES",
                "Manage music releases"
        );

        addMusicControlButton(
                "🎧  PLAYLISTS",
                "Create and manage playlists"
        );

        addMusicControlButton(
                "👥  MUSIC USERS",
                "Listener accounts and activity"
        );

        addMusicControlButton(
                "📊  MUSIC ANALYTICS",
                "Streaming and usage data"
        );

        addMusicControlButton(
                "⚙️  MUSIC SETTINGS",
                "Music platform settings"
        );

        setContentView(root);
    }

    // =========================================================
    // MUSIC CONTROL BUTTON
    // =========================================================

    private void addMusicControlButton(
            String title,
            String description
    ) {

        LinearLayout card =
                new LinearLayout(this);

        card.setOrientation(
                LinearLayout.VERTICAL
        );

        card.setPadding(
                22,
                18,
                22,
                18
        );

        GradientDrawable background =
                new GradientDrawable();

        background.setColor(
                Color.rgb(20, 17, 38)
        );

        background.setCornerRadius(24);

        background.setStroke(
                2,
                Color.rgb(80, 60, 150)
        );

        card.setBackground(background);

        // TITLE
        TextView name =
                new TextView(this);

        name.setText(title);

        name.setTextColor(
                Color.WHITE
        );

        name.setTextSize(17);

        name.setTypeface(
                Typeface.DEFAULT,
                Typeface.BOLD
        );

        card.addView(name);

        // DESCRIPTION
        TextView desc =
                new TextView(this);

        desc.setText(description);

        desc.setTextColor(
                Color.rgb(175, 170, 200)
        );

        desc.setTextSize(13);

        desc.setPadding(
                0,
                6,
                0,
                0
        );

        card.addView(desc);

        // CLICK
        card.setOnClickListener(
                v -> showMessage(title)
        );

        LinearLayout.LayoutParams params =
                new LinearLayout.LayoutParams(
                        LinearLayout.LayoutParams.MATCH_PARENT,
                        LinearLayout.LayoutParams.WRAP_CONTENT
                );

        params.setMargins(
                0,
                6,
                0,
                8
        );

        root.addView(
                card,
                params
        );
    }

    // =========================================================
    // MENU
    // =========================================================

    private void showMenu() {

        Toast.makeText(
                this,
                "Analytics • Royalty • Security • Notifications • Global • Settings",
                Toast.LENGTH_LONG
        ).show();
    }

    // =========================================================
    // MESSAGE
    // =========================================================

    private void showMessage(
            String text
    ) {

        Toast.makeText(
                this,
                text,
                Toast.LENGTH_SHORT
        ).show();
    }
}
